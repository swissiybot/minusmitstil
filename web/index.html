<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aktien-Kaufplan</title>
<script src="lib/lightweight-charts.js"></script>
<style>
:root{
  --bg:#131722; --panel:#1e222d; --panel2:#2a2e39; --line:#363a45; --text:#d1d4dc; --muted:#868993;
  --gruen:#26a69a; --gruen2:#089981; --rot:#ef5350; --gelb:#f0b90b; --blau:#2962ff; --orange:#ff9800;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,sans-serif}
header{display:flex;gap:16px;align-items:baseline;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}
header .stand{color:var(--muted)}
header .hinweis{color:var(--muted);font-size:11px;margin-left:auto}
#kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;padding:10px 16px}
.kachel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer}
.kachel:hover{border-color:var(--blau)}
.kachel .n{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kachel .s{font-size:20px;font-weight:600}
.kachel .z{font-size:11px}
main{display:grid;grid-template-columns:minmax(500px,47%) 1fr;gap:10px;padding:0 16px 16px;min-height:calc(100vh - 190px)}
@media (max-width:1000px){main{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.filter{display:flex;gap:8px;flex-wrap:wrap;padding:8px;border-bottom:1px solid var(--line);align-items:center}
.filter input,.filter select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:5px 7px;font:inherit}
.filter label{color:var(--muted);display:flex;gap:4px;align-items:center}
.tabelle{overflow:auto;flex:1;max-height:calc(100vh - 250px)}
table{border-collapse:collapse;width:100%}
th,td{padding:5px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid #2a2e39}
th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-weight:500;cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left}
tr:hover td{background:#2a2e3988}
tr.aktiv td{background:#2962ff22}
td .nm{max-width:170px;overflow:hidden;text-overflow:ellipsis;display:block}
td .sym{color:var(--muted);font-size:11px}
.ampel{display:inline-block;min-width:38px;padding:1px 6px;border-radius:3px;font-weight:600;text-align:center;color:#fff}
.mehr{padding:8px;text-align:center}
.mehr button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:5px 12px;cursor:pointer}
#detail{padding:0}
#kopf{padding:10px 12px;border-bottom:1px solid var(--line)}
#kopf h2{margin:0;font-size:16px}
#kopf .grund{color:var(--muted);margin-top:4px}
#chart{height:430px}
#chart2{height:120px;border-top:1px solid var(--line)}
.legende{display:flex;gap:14px;flex-wrap:wrap;padding:6px 12px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}
.legende i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:4px}
.werte{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;padding:10px 12px}
.wert{background:var(--panel2);border-radius:4px;padding:7px 9px}
.wert .k{font-size:11px;color:var(--muted)}
.wert .v{font-size:15px;font-weight:600}
.wert .u{font-size:11px;color:var(--muted)}
.wtab{margin:0 12px 12px;width:calc(100% - 24px)}
.wtab td,.wtab th{text-align:right}
.wtab th{position:static}
.text{padding:0 12px 12px;color:var(--muted);font-size:12px}
.pos{color:var(--gruen)} .neg{color:var(--rot)}
.leer{padding:40px;text-align:center;color:var(--muted)}
.kachel.breit{grid-column:span 2}
.kachel.sonder{border-color:#2962ff66}
.kachel .drei{display:flex;gap:12px;margin-top:2px}
.kachel .drei div{flex:1;min-width:0}
.kachel .drei b{font-size:17px;display:block}
.kachel .drei span{font-size:11px;color:var(--muted)}
.reiter{display:flex;gap:2px;padding:0 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel)}
.reiter button{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:8px 12px;cursor:pointer;font:inherit}
.reiter button.an{color:var(--text);border-bottom-color:var(--blau)}
.eingabe{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:10px 12px}
.eingabe label{display:flex;flex-direction:column;gap:3px;color:var(--muted);font-size:11px}
.eingabe input,.eingabe select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:5px 7px;font:inherit;width:110px}
.eingabe button,.knopf{background:var(--blau);color:#fff;border:none;border-radius:4px;padding:6px 14px;cursor:pointer;font:inherit}
.knopf.leise{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.knopf.an{background:var(--blau);color:#fff}
.zweispaltig{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:0 12px 12px;align-items:start}
@media (max-width:1300px){.zweispaltig{grid-template-columns:1fr}}
.kal{background:var(--panel2);border-radius:4px}
.kal text{fill:var(--muted);font-size:10px}
.merke{margin:0 12px 12px;padding:8px 10px;border-left:3px solid var(--gelb);background:#f0b90b14;font-size:12px}
.merke.gut{border-left-color:var(--gruen);background:#26a69a14}
.merke.schlecht{border-left-color:var(--rot);background:#ef535014}
h3{font-size:13px;margin:12px 12px 6px;font-weight:600}
#chart3{height:220px;margin:0 12px 12px;border:1px solid var(--line);border-radius:4px}
.mini{height:150px;margin:0 12px 6px;border:1px solid var(--line);border-radius:4px}
</style>
</head>
<body>
<header>
  <h1>Aktien-Kaufplan</h1><span class="stand" id="stand">lädt …</span>
  <span class="hinweis">Historische Statistik, keine Anlageberatung. Vergangene Kurse garantieren nichts.</span>
</header>
<div id="kacheln"></div>
<main>
  <section class="box">
    <div class="filter">
      <input id="suche" placeholder="Suche Name oder Kürzel" size="18">
      <select id="gruppe"><option value="">Alle Gruppen</option><option>ETF</option><option>Krypto</option><option>Nasdaq</option><option>FTSE All-World</option></select>
      <label>min. Jahre <input id="minj" type="number" value="10" min="0" style="width:52px"></label>
      <label><input id="nurq" type="checkbox" checked> nur stabiler Aufwärtstrend</label>
      <label>min. Umsatz/Tag <select id="minu"><option value="0">egal</option><option value="1e6">1 Mio $</option><option value="1e7" selected>10 Mio $</option><option value="1e8">100 Mio $</option></select></label>
    </div>
    <div class="tabelle"><table>
      <thead><tr>
        <th data-s="name">Wert</th><th data-s="score" title="0-100: hoch = historisch günstig">Ampel ▼</th>
        <th data-s="cagr20" title="Durchschnittliche Jahresrendite über 20 Jahre (oder verfügbare Jahre)">Ø Jahr</th>
        <th data-s="p3" title="Anteil früherer ähnlicher Lagen mit höherem Kurs nach 3 Jahren">3J höher</th>
        <th data-s="vorteil" title="Trefferquote ähnlicher Lagen minus Trefferquote an allen Tagen">Vorteil</th>
        <th data-s="rueck" title="So oft fiel der Kurs danach noch mind. 10 % tiefer (innerhalb 1 Jahr)">Rückschlag</th>
        <th data-s="dd">vom Hoch</th><th data-s="delta" title="Änderung der Ampel in 4 Wochen">4W</th>
      </tr></thead><tbody id="zeilen"></tbody></table>
      <div class="mehr"><button id="mehr">mehr anzeigen</button> <span id="anzahl" class="stand"></span></div>
    </div>
  </section>
  <section class="box" id="detail"><div class="leer">Wert in der Liste anklicken.</div></section>
</main>
<script>
const $ = s => document.querySelector(s);
let ALLE = [], ANZEIGE = 200, SORT = {k:"score", dir:-1}, AKTIV = null;
const fmt = (x, n=1, suf="") => x==null ? "–" : (Math.round(x*10**n)/10**n).toLocaleString("de-DE",{minimumFractionDigits:n,maximumFractionDigits:n})+suf;
const farbe = s => s==null ? "#555" : s>=80 ? "#089981" : s>=60 ? "#26a69a99" : s>40 ? "#5d606b" : s>15 ? "#ef535099" : "#ef5350";
const zonen = {"historisch sehr guenstig":"historisch sehr günstig","guenstig":"günstig","neutral":"neutral","teuer":"teuer","historisch sehr teuer":"historisch sehr teuer","keine Daten":"keine Daten"};
const umlaut = t => (t||"").replace(/ae/g,"ä").replace(/oe/g,"ö").replace(/ue/g,"ü").replace(/Standardabw\./g,"Standardabw.");
const p3 = w => w.p && w.p["3"] ? w.p["3"] : null;
const wert = (w,k) => ({score:w.score, cagr20:w.cagr20, p3:p3(w)?.quote, vorteil:p3(w) ? p3(w).quote-p3(w).basis : null,
  rueck:w.p?.rueckschlag10, dd:w.dd, delta:(w.score!=null&&w.score_vor4w!=null)? w.score-w.score_vor4w : null, name:w.name})[k];

let UMFELD = null, PRUEF = null, TAGEBUCH = null;
const holeJson = async url => { try { const r = await fetch(url, {cache:"no-store"}); return r.ok ? await r.json() : null; } catch(e) { return null; } };
const geld = x => x==null ? "–" : Math.round(x).toLocaleString("de-DE");
const vz = (x, n=1, suf="") => x==null ? "–" : (x>0?"+":"") + fmt(x,n,suf);
const klasse = x => x==null ? "" : x>0 ? "pos" : x<0 ? "neg" : "";

async function start(){
  const r = await fetch("daten/rangliste.json", {cache:"no-store"});
  const d = await r.json();
  [UMFELD, PRUEF, TAGEBUCH] = await Promise.all(["daten/umfeld.json","daten/pruefung.json","daten/tagebuch_pruefung.json"].map(holeJson));
  ALLE = d.werte; $("#stand").textContent = "Stand " + d.stand + " · " + ALLE.length + " Werte";
  kacheln(); liste();
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("seite") === "umfeld") zeigeUmfeld();
  else if (h.get("seite") === "pruefung") zeigePruefungGesamt();
  else zeige(h.get("w") || "SPY");
}
function vixWort(v){ return v==null ? "" : v<15 ? "ruhig" : v<25 ? "normal" : v<35 ? "nervös" : "Panik"; }
function breiteWort(b){ return b==null ? "" : b<30 ? "schwach" : b<70 ? "gemischt" : "breit"; }
function kacheln(){
  const k = ALLE.filter(w => w.gruppe==="ETF" || w.gruppe==="Krypto");
  let sonder = "";
  if (UMFELD) {
    const b = UMFELD.breite, v = UMFELD.vix, z = UMFELD.zinskurve;
    sonder += `<div class="kachel breit sonder" id="k-umfeld" title="Marktumfeld anzeigen">
      <div class="n">Marktumfeld · Stand ${(v||b||z||{}).datum||""}</div>
      <div class="drei">
        <div title="Anteil der Aktien über ihrer 40-Wochen-Linie"><b>${b?fmt(b.wert,0,"%"):"–"}</b><span>Marktbreite · ${b?breiteWort(b.wert):""}</span></div>
        <div title="Erwartete Schwankung des S&P 500 (Angstbarometer)"><b style="color:${v&&v.wert>=25?"var(--rot)":"inherit"}">${v?fmt(v.wert,1):"–"}</b><span>VIX · ${v?vixWort(v.wert):""}</span></div>
        <div title="Zinsdifferenz 10 Jahre minus 2 Jahre (US)"><b style="color:${z&&z.invertiert?"var(--rot)":"inherit"}">${z?vz(z.wert,2):"–"}</b><span>Zinskurve · ${z?(z.invertiert?"invertiert":"normal"):""}</span></div>
      </div></div>`;
  }
  if (PRUEF) {
    const e = PRUEF.kalibrierung?.etf?.["3"], s = PRUEF.strategie?.zusammen?.etf;
    sonder += `<div class="kachel sonder" id="k-pruefung" title="Walk-forward-Prüfung, Strategie-Vergleich, Tagebuch">
      <div class="n">Prüfung der Ampel</div>
      <div class="s" style="font-size:15px;margin-top:3px">${e && e.skill!=null ? (e.skill>0?"hilft etwas":"kein Vorteil") : "–"}</div>
      <div class="z" style="color:var(--muted)">ETFs, 3 J., außerhalb der Lernzeit${s?` · Staffel besser bei ${fmt(s.staffel_besser,0)} %`:""}</div></div>`;
  }
  $("#kacheln").innerHTML = sonder + k.map(w => `<div class="kachel" data-id="${w.id}">
    <div class="n">${w.name.replace(" (ETF)","")}</div>
    <div class="s" style="color:${farbe(w.score)}">${fmt(w.score,0)}</div>
    <div class="z">${zonen[w.zone]} · Ø ${fmt(w.cagr20,1,"%")}/J</div></div>`).join("");
  document.querySelectorAll(".kachel[data-id]").forEach(e => e.onclick = () => zeige(e.dataset.id));
  if ($("#k-umfeld")) $("#k-umfeld").onclick = () => zeigeUmfeld();
  if ($("#k-pruefung")) $("#k-pruefung").onclick = () => zeigePruefungGesamt();
}
function gefiltert(){
  const q = $("#suche").value.trim().toLowerCase(), g = $("#gruppe").value, mj = +$("#minj").value||0,
        nq = $("#nurq").checked, mu = +$("#minu").value;
  return ALLE.filter(w => w.score!=null
    && (!q || w.name.toLowerCase().includes(q) || w.symbol.toLowerCase().includes(q))
    && (!g || w.gruppe.includes(g))
    && (w.jahre_daten||0) >= mj
    && (!nq || w.qualitaet || w.gruppe==="ETF" || w.gruppe==="Krypto")
    && (w.gruppe==="ETF" || w.gruppe==="Krypto" || (w.umsatz_usd||0) >= mu));
}
function liste(){
  const f = gefiltert().sort((a,b) => {
    const x = wert(a,SORT.k), y = wert(b,SORT.k);
    if (x==null) return 1; if (y==null) return -1;
    return (x>y?1:x<y?-1:0) * SORT.dir;
  });
  $("#anzahl").textContent = `${Math.min(ANZEIGE,f.length)} von ${f.length}`;
  $("#mehr").style.display = f.length > ANZEIGE ? "" : "none";
  $("#zeilen").innerHTML = f.slice(0,ANZEIGE).map(w => {
    const p = p3(w), v = p ? p.quote-p.basis : null, de = wert(w,"delta");
    return `<tr data-id="${w.id}" class="${w.id===AKTIV?"aktiv":""}">
      <td><span class="nm">${w.name}</span><span class="sym">${w.symbol} · ${w.gruppe}</span></td>
      <td><span class="ampel" style="background:${farbe(w.score)}">${fmt(w.score,0)}</span></td>
      <td class="${w.cagr20>0?"pos":"neg"}" title="${fmt(w.cagr_jahre,0)} Jahre${w.cagr20_div?", mit Dividenden":", ohne Dividenden"}">${fmt(w.cagr20,1,"%")}</td>
      <td title="${p?p.episoden+" Phasen, "+p.wochen+" Wochen":""}">${p?fmt(p.quote,0,"%"):"–"}</td>
      <td class="${v>0?"pos":v<0?"neg":""}">${v==null?"–":(v>0?"+":"")+fmt(v,0)}</td>
      <td>${fmt(w.p?.rueckschlag10,0,"%")}</td>
      <td>${fmt(w.dd,0,"%")}</td>
      <td class="${de>0?"pos":de<0?"neg":""}">${de==null?"–":(de>0?"+":"")+fmt(de,0)}</td></tr>`;
  }).join("");
  document.querySelectorAll("#zeilen tr").forEach(e => e.onclick = () => zeige(e.dataset.id));
}
["#suche","#gruppe","#minj","#nurq","#minu"].forEach(s => $(s).addEventListener("input", () => {ANZEIGE=200; liste();}));
$("#mehr").onclick = () => {ANZEIGE += 300; liste();};
document.querySelectorAll("th[data-s]").forEach(th => th.onclick = () => {
  const k = th.dataset.s; SORT = {k, dir: SORT.k===k ? -SORT.dir : (k==="name"||k==="rueck" ? 1 : -1)};
  document.querySelectorAll("th[data-s]").forEach(t => t.textContent = t.textContent.replace(/ [▲▼]$/,""));
  th.textContent += SORT.dir<0 ? " ▼" : " ▲"; liste();
});

let charts = [], tabCharts = [], KERZEN = null, HAUPT = null, KEGEL = [], LIMITLINIEN = [], INFO = null, REITER = "kennzahlen";
const chartBasis = () => ({autoSize:true, layout:{background:{color:"#1e222d"},textColor:"#d1d4dc"},grid:{vertLines:{color:"#2a2e39"},horzLines:{color:"#2a2e39"}},
  timeScale:{borderColor:"#363a45",minBarSpacing:0.02},rightPriceScale:{borderColor:"#363a45"},crosshair:{mode:0},
  localization:{locale:"de-DE",priceFormatter:p => Math.abs(p)>=100 ? Math.round(p).toLocaleString("de-DE") : p.toLocaleString("de-DE",{maximumSignificantDigits:4})}});
function alleChartsWeg(){ charts.concat(tabCharts).forEach(ch => { try { ch.remove(); } catch(e){} }); charts = []; tabCharts = []; KEGEL = []; LIMITLINIEN = []; KERZEN = null; HAUPT = null; }

async function zeige(id){
  AKTIV = id; location.hash = "w=" + encodeURIComponent(id);
  document.querySelectorAll("#zeilen tr").forEach(e => e.classList.toggle("aktiv", e.dataset.id===id));
  const r = await fetch("api/wert?id=" + encodeURIComponent(id));
  if (!r.ok) { $("#detail").innerHTML = '<div class="leer">Keine Daten für ' + id + '</div>'; return; }
  const {info:w, chart:c} = await r.json();
  if (AKTIV !== id) return;
  alleChartsWeg(); INFO = w;
  const btc = w.gruppe === "Krypto";
  $("#detail").innerHTML = `
    <div id="kopf"><h2>${w.name} <span class="sym">${w.symbol}</span>
      <span class="ampel" style="background:${farbe(w.score)};margin-left:8px">${fmt(w.score,0)}</span>
      <span style="font-size:13px;font-weight:400;color:${farbe(w.score)}"> ${zonen[w.zone]}</span></h2>
      <div class="grund">${umlaut(w.grund)}</div></div>
    <div id="chart"></div><div id="chart2"></div>
    <div class="legende">
      <span><i style="background:#f0b90b"></i>200-Wochen-Linie</span>
      <span><i style="background:#2962ff"></i>Langfristtrend (±2 Standardabw.)</span>
      ${btc?'<span><i style="background:#e040fb"></i>Pi Cycle: 150-Tage-EMA</span><span><i style="background:#00bcd4"></i>471-Tage-SMA × 0,745</span>':''}
      <span><i style="background:#b39ddb"></i>Kegel: 12 Monate, 50 % / 90 % der simulierten Wege</span>
      <span>▲ Ampel ≥ 80 · ▼ Ampel ≤ 15 · unten: Ampel im Zeitverlauf</span>
    </div>
    <div class="reiter">
      <button data-r="kennzahlen">Kennzahlen</button><button data-r="rechner">Kurs-Rechner</button>
      <button data-r="pruefung">Prüfung</button><button data-r="strategie">Strategie-Vergleich</button>
    </div>
    <div id="tab"></div>`;
  document.querySelectorAll(".reiter button").forEach(b => b.onclick = () => reiter(b.dataset.r));
  zeichne(c, btc);
  reiter(REITER);
  ladeKegel(52, 20, []);
}

function reiter(name){
  REITER = name;
  tabCharts.forEach(ch => { try { ch.remove(); } catch(e){} }); tabCharts = [];
  document.querySelectorAll(".reiter button").forEach(b => b.classList.toggle("an", b.dataset.r===name));
  ({kennzahlen:tabKennzahlen, rechner:tabRechner, pruefung:tabPruefung, strategie:tabStrategie})[name](INFO);
}

function tabKennzahlen(w){
  const pz = k => w.p && w.p[k] ? w.p[k] : null;
  const zeileP = (k, txt) => { const p = pz(k); if (!p) return `<tr><td style="text-align:left">${txt}</td><td colspan="5">zu wenig ähnliche Fälle</td></tr>`;
    const v = p.quote - p.basis;
    return `<tr><td style="text-align:left">${txt}</td><td><b>${fmt(p.quote,0,"%")}</b></td><td>${fmt(p.basis,0,"%")}</td>
      <td class="${klasse(v)}">${vz(v,0)}</td><td>${fmt(p.median_pa,1,"%")} / ${fmt(p.basis_median_pa,1,"%")}</td><td>${p.episoden} (${p.wochen} Wo.)</td></tr>`; };
  const seg = w.segmente.map(s => `ab ${s.ab.slice(0,4)}: ${umlaut(s.art)} (${s.symbol})`).join(" → ");
  const btc = w.gruppe === "Krypto";
  $("#tab").innerHTML = `
    <div class="werte">
      <div class="wert"><div class="k">Ø Jahresrendite</div><div class="v ${w.cagr20>0?"pos":"neg"}">${fmt(w.cagr20,1,"%")}</div><div class="u">${fmt(w.cagr_jahre,0)} Jahre, ${w.cagr20_div?"mit":"ohne"} Dividenden</div></div>
      <div class="wert"><div class="k">Ø seit Beginn</div><div class="v">${fmt(w.cagr_max,1,"%")}</div><div class="u">${fmt(w.jahre_daten,0)} Jahre Daten</div></div>
      <div class="wert"><div class="k">Abstand zum Hoch</div><div class="v">${fmt(w.dd,1,"%")}</div><div class="u">zur 200-Wochen-Linie ${fmt(w.zu200w,0,"%")}</div></div>
      <div class="wert"><div class="k">Rückschlagrisiko</div><div class="v">${fmt(w.p?.rueckschlag10,0,"%")}</div><div class="u">fiel danach noch ≥ 10 % (Median ${fmt(w.p?.median_tiefer,0,"%")})</div></div>
      <div class="wert"><div class="k">Trendgüte (R²)</div><div class="v">${fmt(w.trend_r2,2)}</div><div class="u">${w.qualitaet?"stabiler Aufwärtstrend":"kein stabiler Trend – Signal unsicher"}</div></div>

async function ladeKegel(wochen, jahre, preise){
  const id = AKTIV;
  const r = await fetch(`api/mc?id=${encodeURIComponent(id)}&wochen=${wochen}&jahre=${jahre}&preise=${preise.join(",")}`);
  if (!r.ok || AKTIV !== id || !HAUPT) return null;
  const m = await r.json();
  if (m.fehler) return m;
  KEGEL.forEach(s => HAUPT.removeSeries(s)); KEGEL = [];
  [["q5","#b39ddb88",2],["q25","#b39ddb",0],["q50","#b39ddb",0],["q75","#b39ddb",0],["q95","#b39ddb88",2]].forEach(([k,f,st]) => {
    const s = HAUPT.addLineSeries({color:f,lineWidth:k==="q50"?2:1,lineStyle:st,priceLineVisible:false,lastValueVisible:k==="q50",crosshairMarkerVisible:false,title:k==="q50"?"Median":""});
    s.setData(m.t.map((t,i)=>({time:t,value:m.kegel[k][i]}))); KEGEL.push(s);
  });
  return m;
}

// ------------------------------------------------------------ Kalibrierung
function svgKal(kurven){
  const W=290, H=270, L=38, B=32, R=10, T=10;
  const x = v => L + v/100*(W-L-R), y = v => H-B - v/100*(H-B-T);
  const maxN = Math.max(1, ...kurven.flatMap(k => k.bins.map(b => b.n)));
  let s = `<svg class="kal" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  for (const v of [0,25,50,75,100]) s += `<line x1="${x(0)}" y1="${y(v)}" x2="${x(100)}" y2="${y(v)}" stroke="#363a45"/><line x1="${x(v)}" y1="${y(0)}" x2="${x(v)}" y2="${y(100)}" stroke="#363a45"/>
    <text x="${L-5}" y="${y(v)+3}" text-anchor="end">${v}</text><text x="${x(v)}" y="${H-B+13}" text-anchor="middle">${v}</text>`;
  s += `<line x1="${x(0)}" y1="${y(0)}" x2="${x(100)}" y2="${y(100)}" stroke="#868993" stroke-dasharray="4 3"/>
    <text x="${x(50)}" y="${H-4}" text-anchor="middle">angezeigt (%)</text><text x="11" y="${y(50)}" text-anchor="middle" transform="rotate(-90 11 ${y(50)})">eingetreten (%)</text>`;
  for (const k of kurven) {
    const pk = k.bins.filter(b => b.angezeigt!=null);
    s += `<polyline fill="none" stroke="${k.farbe}" stroke-width="1.5" points="${pk.map(b => x(b.angezeigt)+","+y(b.eingetreten)).join(" ")}"/>`;
    s += pk.map(b => `<circle cx="${x(b.angezeigt)}" cy="${y(b.eingetreten)}" r="${2.5+Math.sqrt(b.n/maxN)*6}" fill="${k.farbe}" fill-opacity=".75"><title>${k.name}: angezeigt ${fmt(b.angezeigt,0)} %, eingetreten ${fmt(b.eingetreten,0)} % (${b.n.toLocaleString("de-DE")} Wochen)</title></circle>`).join("");
  }
  return s + `</svg>`;
}

  kerzen.setMarkers(c.marken.map(([t,art,s]) => art==="kauf"

  const ch2 = LightweightCharts.createChart($("#chart2"), {...basis, timeScale:{...basis.timeScale, visible:false}});
  const sc = ch2.addHistogramSeries({priceLineVisible:false, priceFormat:{type:"price",precision:0,minMove:1}});
  sc.setData(c.t.map((t,i)=> c.score[i]==null ? {time:t} : {time:t,value:c.score[i],color:farbe(c.score[i])}));

  setTimeout(() => ch.timeScale().fitContent(), 50);
  charts = [ch, ch2]; KERZEN = kerzen; HAUPT = ch;
}

  document.querySelectorAll("#zeilen tr").forEach(e => e.classList.remove("aktiv"));
  const u = UMFELD;
  if (!u) { $("#detail").innerHTML = '<div class="leer">Marktumfeld noch nicht berechnet (läuft mit aktualisieren.sh).</div>'; return; }
  const b = u.breite, v = u.vix, z = u.zinskurve;
  const teil = (titel, x, wert, wort, text, id, nk=1) => x ? `<h3>${titel}: ${wert} <span style="font-weight:400;color:var(--muted)">· ${wort} · Stand ${x.datum.split("-").reverse().join(".")} · vor 4 Wochen ${x.vor4w==null?"–":fmt(x.vor4w, nk)}</span></h3>
      <div class="mini" id="${id}"></div><div class="text">${text} Quelle: ${x.quelle}.</div>` : `<h3>${titel}: keine Daten</h3>`;
  $("#detail").innerHTML = `<div id="kopf"><h2>Marktumfeld</h2><div class="grund">Wie steht der Gesamtmarkt? Drei einfache Messgrößen, nur beschreibend – kein Kauf- oder Verkaufssignal.</div></div>
    ${teil("Marktbreite", b, b?fmt(b.wert,0,"%"):"", b?breiteWort(b.wert):"", b?`Anteil der ${b.aktien.toLocaleString("de-DE")} Nasdaq-Aktien, die über ihrer 40-Wochen-Linie schließen. Niedrig heißt: die meisten Aktien sind im Abwärtstrend. Seit 2000 war der Wert nur in ${fmt(b.perzentil,0)} % der Wochen niedriger. Achtung: nur heute noch gelistete Aktien (Pleitefirmen fehlen), frühere Jahre wirken deshalb zu gut.`:"", "m-breite")}
    ${teil("VIX", v, v?fmt(v.wert,1):"", v?vixWort(v.wert):"", v?`Die vom Optionsmarkt erwartete Schwankung des S&P 500 für die nächsten 30 Tage („Angstbarometer“). Median seit 1990: ${fmt(v.median,1)}; höher als heute nur in ${fmt(100-v.perzentil,0)} % der Tage. Grob: unter 15 ruhig, 15–25 normal, 25–35 nervös, über 35 Panik.`:"", "m-vix")}
    ${teil("Zinskurve 10 J. – 2 J.", z, z?vz(z.wert,2," Pp."):"", z?z.text:"", z?`Zinsdifferenz zwischen 10- und 2-jährigen US-Staatsanleihen. Negativ („invertiert“) heißt: kurzfristiges Geld ist teurer als langfristiges. Vor den meisten US-Rezessionen seit 1976 war die Kurve vorher invertiert, der Abstand bis zur Rezession schwankte aber stark (Monate bis Jahre).`:"", "m-zins", 2)}
    ${u.zins3m?`<div class="text">US-Geldmarkt 3 Monate (FRED TB3MS): ${fmt(u.zins3m.wert,2,"%")} (${u.zins3m.datum}) – wird im Strategie-Vergleich als Zins auf wartendes Geld verwendet.</div>`:""}`;
  if (b) miniChart($("#m-breite"), b.reihe, "#26a69a", [[50,"#868993",""],[30,"#ef5350",""]]);
  if (v) miniChart($("#m-vix"), v.reihe, "#ef5350", [[v.median,"#868993","Median"]]);
  if (z) miniChart($("#m-zins"), z.reihe, "#2962ff", [[0,"#ef5350",""]]);
}
function zeigePruefungGesamt(gruppe="etf", h="3"){
  AKTIV = null; location.hash = "seite=pruefung"; alleChartsWeg();
  document.querySelectorAll("#zeilen tr").forEach(e => e.classList.remove("aktiv"));
  if (!PRUEF) { $("#detail").innerHTML = '<div class="leer">Prüfung noch nicht berechnet (läuft mit aktualisieren.sh).</div>'; return; }
  const k = PRUEF.kalibrierung, s = PRUEF.strategie, e = k[gruppe]?.[h];
  const zus = (t, x) => x ? `<tr><td style="text-align:left">${t}</td><td>${x.werte.toLocaleString("de-DE")}</td><td>${fmt(x.median_irr_spar,1,"%")}</td><td>${fmt(x.staffel_besser,0,"%")}</td><td class="${klasse(x.median_diff_staffel)}">${vz(x.median_diff_staffel,2)}</td><td>${fmt(x.staffel_vk_besser,0,"%")}</td><td class="${klasse(x.median_diff_staffel_vk)}">${vz(x.median_diff_staffel_vk,2)}</td></tr>` : "";
  const tb = TAGEBUCH;
  let tbHtml = '<div class="text">Noch keine Auswertung des Tagebuchs.</div>';
  if (tb) {
    const erg = tb.ergebnisse || {};
    tbHtml = `<div class="text">Seit ${tb.erster_tag?tb.erster_tag.split("-").reverse().join("."):"–"} hält das Tool jeden Tag fest, was es angezeigt hat (${tb.tage} Tage, ${tb.signale.toLocaleString("de-DE")} Signale, ${tb.werte||0} Werte). Diese Einträge werden nie geändert und später mit dem echten Kursverlauf verglichen – das ist die ehrlichste Prüfung, weil sie erst nach dem Signal stattfindet.</div>
      <table class="wtab"><thead><tr><th style="text-align:left">Nachprüfung</th><th>erste fällig ab</th><th>fällig</th><th>geprüft</th><th>Kurs höher</th></tr></thead><tbody>${
      ["1","3","5"].map(j => { const x = erg[j] || {}; return `<tr><td style="text-align:left">nach ${j} Jahr${j==="1"?"":"en"}</td><td>${(tb.faellig_ab||{})[j]?.split("-").reverse().join(".")||"–"}</td><td>${x.faellig||0}</td><td>${x.geprueft||0}</td><td>${x.quote==null?"–":fmt(x.quote,0,"%")}</td></tr>`; }).join("")}</tbody></table>
      ${["1","3","5"].map(j => (erg[j]?.zonen||[]).length ? `<h3>Nach ${j} Jahr${j==="1"?"":"en"} je Zone</h3><table class="wtab"><thead><tr><th style="text-align:left">Zone</th><th>Signale</th><th>Werte</th><th>Kurs höher</th><th>Median</th></tr></thead><tbody>${erg[j].zonen.map(z => `<tr><td style="text-align:left">${zonen[z.zone]||z.zone}</td><td>${z.signale}</td><td>${z.werte}</td><td>${fmt(z.quote,0,"%")}</td><td>${fmt(z.median,1,"%")}</td></tr>`).join("")}</tbody></table>${(erg[j].kalibrierung||[]).length?`<div style="padding:0 12px">${svgKal([{name:"Tagebuch",farbe:"#26a69a",bins:erg[j].kalibrierung}])}</div>`:""}` : "").join("")}`;
  }
  $("#detail").innerHTML = `<div id="kopf"><h2>Prüfung der Ampel</h2><div class="grund">Hätte die Ampel früher gestimmt? Rückblick ohne Zukunftswissen über alle Werte, Strategie-Vergleich und Signal-Tagebuch. Stand ${PRUEF.stand}.</div></div>
    <h3>1. Walk-forward-Kalibrierung über viele Werte</h3>
    <div class="eingabe">${Object.entries(k).map(([g,x]) => `<button class="knopf leise ${g===gruppe?"an":""}" data-g="${g}">${x.name.replace(" (Auswahl mit Rückblick!)","*")}</button>`).join("")}
      <span style="width:16px"></span>${["1","3","5"].map(j => `<button class="knopf leise ${j===h?"an":""}" data-h="${j}">${j} J.</button>`).join("")}</div>
    ${kalBlock(e, `${k[gruppe].name}, nach ${h} Jahr${h==="1"?"":"en"}`)}
    <div class="text">${PR_TEXT} ${gruppe==="aktien_stabil"?"* Die Auswahl „stabiler Aufwärtstrend“ nutzt den ganzen Kursverlauf bis heute – sie kennt also die Zukunft und ist deshalb zu günstig.":""}
      Bei Aktien fehlen Firmen, die pleite gingen oder übernommen wurden; die Quoten sind dadurch zu gut.</div>
    <h3>2. Strategie-Vergleich über viele Werte</h3>
    <div class="text">${s.annahmen}. Unterschied im internen Zinsfuß in Prozentpunkten gegenüber dem Sparplan (Median).</div>
    <table class="wtab"><thead><tr><th style="text-align:left">Gruppe</th><th>Werte</th><th>Sparplan p.a.</th><th>Staffel besser</th><th>Staffel ±</th><th>+ Teilverkauf besser</th><th>+ Teilverkauf ±</th></tr></thead><tbody>
      ${zus("ETFs / Indizes", s.zusammen.etf)}${zus("Aktien (alle)", s.zusammen.aktien)}${zus("Aktien mit 20 Jahren Vergleich", s.zusammen.aktien_20j)}${zus("Aktien stabiler Trend*", s.zusammen.aktien_stabil)}</tbody></table>
    <table class="wtab"><thead><tr><th style="text-align:left">ETF / Krypto</th><th>ab</th><th>Sparplan</th><th>Staffel</th><th>+ Teilverkauf</th><th>größter Rückgang (Spar / Staffel)</th></tr></thead><tbody>${
      s.einzeln.map(r => `<tr style="cursor:pointer" data-id="${r.id}"><td style="text-align:left">${r.name.replace(" (ETF)","")}</td><td>${r.von.slice(0,4)}</td><td>${fmt(r.spar_irr,1,"%")}</td><td class="${klasse(r.staffel_irr-r.spar_irr)}">${fmt(r.staffel_irr,1,"%")}</td><td class="${klasse(r.staffel_vk_irr-r.spar_irr)}">${fmt(r.staffel_vk_irr,1,"%")}</td><td>${fmt(r.spar_max_verlust,0,"%")} / ${fmt(r.staffel_max_verlust,0,"%")}</td></tr>`).join("")}</tbody></table>
    <div class="text">Interner Zinsfuß nach Kosten und Steuern (alles am Ende verkauft). Grün = besser als der Sparplan. Zeile anklicken öffnet den Wert.</div>
    <h3>3. Signal-Tagebuch</h3>${tbHtml}`;
  document.querySelectorAll("#detail [data-g]").forEach(b => b.onclick = () => zeigePruefungGesamt(b.dataset.g, h));
  document.querySelectorAll("#detail [data-h]").forEach(b => b.onclick = () => zeigePruefungGesamt(gruppe, b.dataset.h));
  document.querySelectorAll("#detail tr[data-id]").forEach(t => t.onclick = () => { REITER = "strategie"; zeige(t.dataset.id); });
}
start();
</script>
</body>
</html>
