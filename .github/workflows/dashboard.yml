# Online-Fassung des Dashboards: lädt Kurse, rechnet alles neu und veröffentlicht die Seite auf GitHub Pages.
# "Live" heißt hier: mehrmals täglich, keine Echtzeitkurse.
name: Dashboard aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "15 13,15,17,19,21 * * 1-5"   # werktags während der US-Handelszeit, etwa alle 2 Stunden (UTC)
    - cron: "30 5 * * *"                  # täglich früh, auch am Wochenende (Krypto); legt den Tagebuch-Eintrag an

permissions:
  contents: write    # Signal-Tagebuch committen
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false   # Läufe nicht abbrechen, sondern nacheinander

env:
  TZ: Europe/Berlin
  KURSE_NEU_LADEN: "1"        # auch Werte nachladen, die heute schon geladen wurden
  KURSE_ABBRUCH_NACH: "5"     # Yahoo sperrt? Nach 5 leeren Stapeln aufhören und den alten Stand nutzen

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.veroeffentlichen.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Zwischengespeicherte Kurse holen
        uses: actions/cache/restore@v4
        with:
          path: |
            daten/kurse.parquet
            daten/universum.csv
            daten/fred
            daten/shiller
            daten/sec
            daten/isin
            daten/btc_alt
          key: kurse-${{ github.run_id }}
          restore-keys: kurse-

      - name: Werteliste
        run: python universum.py || { echo "::warning::Werteliste nicht ladbar – nutze die zwischengespeicherte"; test -f daten/universum.csv; }

      - name: Bitcoin-Vorgeschichte (Coin Metrics, Bitstamp)
        continue-on-error: true
        run: python btc_alt.py

      - name: Kurse (Yahoo)
        id: kurse
        continue-on-error: true
        run: python kurse.py

      - name: Zinsen (FRED)
        run: python umfeld.py   # vor dem Zwischenspeichern, damit FRED- und Shiller-Dateien im Cache landen

      - name: Bewertung S&P 500 (Shiller-CAPE)
        run: python bewertung.py

      - name: Geschäftszahlen (SEC EDGAR)
        env:
          SEC_KONTAKT: ${{ secrets.SEC_KONTAKT }}   # Kontaktangabe, die die SEC verlangt – nur als geheime Einstellung
        run: python fundamente.py

      - name: ISIN-Liste für den Depot-Import (SEC)
        continue-on-error: true
        env:
          SEC_KONTAKT: ${{ secrets.SEC_KONTAKT }}
        run: python isin.py

      - name: Kurse zwischenspeichern
        if: always() && hashFiles('daten/kurse.parquet') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            daten/kurse.parquet
            daten/universum.csv
            daten/fred
            daten/shiller
            daten/sec
            daten/isin
            daten/btc_alt
          key: kurse-${{ github.run_id }}

      - name: Auswertung
        run: |
          python analyse.py
          python tagebuch_pruefung.py
          python trendstudie.py || echo "::warning::Trendstudie nicht gerechnet"

      - name: Statischer Export
        run: python export.py

      - name: Bericht
        if: always()
        run: |
          {
            echo "## Datenstand"
            if [ -f daten/kurse_lauf.json ]; then
              python -c "import json;d=json.load(open('daten/kurse_lauf.json'));print(f\"Kurse: {d['geladen']} von {d['gesamt']} geladen, {d['ohne_daten']} ohne Daten\" + (' – ABGEBROCHEN, alter Stand veröffentlicht' if d['abgebrochen'] else ''))"
            else
              echo "Kursdownload lief nicht."
            fi
            test -d site/daten/werte && echo "Seite: $(du -sh site | cut -f1), $(ls site/daten/werte | wc -l) Werte"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.kurse.outcome }}" != "success" ]; then echo "::warning::Kursdownload fehlgeschlagen – veröffentlicht wird der letzte Stand"; fi
          if [ -f daten/kurse_lauf.json ] && python -c "import json,sys;d=json.load(open('daten/kurse_lauf.json'));sys.exit(0 if d['abgebrochen'] or d['ohne_daten']>0.2*d['gesamt'] else 1)"; then
            echo "::warning::Yahoo lieferte viele Werte nicht – siehe Bericht"
          fi

      - name: Signal-Tagebuch sichern (höchstens ein Eintrag pro Tag, nie ändern)
        continue-on-error: true   # die Seite wird trotzdem veröffentlicht
        run: |
          if [ -n "$(git status --porcelain daten/tagebuch)" ]; then
            # nur neue Dateien zulassen – bestehende Einträge dürfen sich nie ändern
            if git status --porcelain daten/tagebuch | grep -v '^??'; then
              echo "::error::Bestehender Tagebuch-Eintrag wurde verändert – wird nicht gesichert"; exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add daten/tagebuch
            git commit -m "Signal-Tagebuch $(date +%F)"
            git pull --rebase origin main && git push origin HEAD:main
          else
            echo "Kein neuer Tagebuch-Eintrag."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site    # reduzierte Online-Fassung ohne Kursreihen (export.py)

      - name: Veröffentlichen
        id: veroeffentlichen
        uses: actions/deploy-pages@v4
