# Online-Fassung des Dashboards: lädt Kurse, rechnet alles neu und veröffentlicht die Seite auf GitHub Pages.
# "Live" heißt hier: mehrmals täglich, keine Echtzeitkurse.
name: Dashboard aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "15 13,15,17,19,21 * * 1-5"   # werktags während der US-Handelszeit, etwa alle 2 Stunden (UTC)
    - cron: "30 5 * * *"                  # täglich früh, auch am Wochenende (Krypto); legt den Tagebuch-Eintrag an

permissions:
  contents: write    # Signal-Tagebuch committen
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false   # Läufe nicht abbrechen, sondern nacheinander

env:
  TZ: Europe/Berlin
  KURSE_NEU_LADEN: "1"        # auch Werte nachladen, die heute schon geladen wurden
  KURSE_ABBRUCH_NACH: "5"     # Yahoo sperrt? Nach 5 leeren Stapeln aufhören und den alten Stand nutzen

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # mit der wöchentlichen Prüfung der Vorhersage (rund 15 Minuten) reichten 90 nicht: Lauf 45194809323 brach beim Veröffentlichen ab
    environment:
      name: github-pages   # wie bisher (Einstellungen der Umgebung gelten für den ganzen Lauf); veröffentlicht wird im zweiten Job
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Zwischengespeicherte Kurse holen
        uses: actions/cache/restore@v4
        with:
          path: |
            daten/kurse.parquet
            daten/universum.csv
            daten/fred
            daten/shiller
            daten/sec
            daten/nasdaq100.json
            daten/kegelpruefung.json
            daten/vorhersage_pruefung.json
            daten/isin
            daten/beschreibung.json
            daten/beschreibung_offen.txt
            daten/wikipedia_saetze.json
            daten/welt
            daten/welt.csv
            daten/btc_alt
            daten/indexanteile_spy.json
            daten/dividenden.parquet
            daten/dividenden_lauf.json
            daten/etf_daten.json
          key: kurse-${{ github.run_id }}
          restore-keys: kurse-

      - name: Stand der Alarme holen (nur Prüfsummen, keine Werte im Klartext)
        uses: actions/cache/restore@v4
        with:
          path: daten/alarm_stand.json
          key: alarm-${{ github.run_id }}
          restore-keys: alarm-

      - name: Auslandsaktien (Wikidata, höchstens wöchentlich neu)
        continue-on-error: true
        run: python welt.py

      - name: Werteliste
        run: python universum.py || { echo "::warning::Werteliste nicht ladbar – nutze die zwischengespeicherte"; test -f daten/universum.csv; }

      - name: Bitcoin-Vorgeschichte (Coin Metrics, Bitstamp)
        continue-on-error: true
        run: python btc_alt.py

      - name: Bitcoin MVRV-Z (Coin Metrics)
        continue-on-error: true
        run: python mvrv.py

      - name: Kurse (Yahoo)
        id: kurse
        continue-on-error: true
        run: python kurse.py

      - name: ETF-Inhalt und Kosten (Yahoo/Morningstar, höchstens einmal pro Woche neu; vor den Dividenden, weil die vielen Dividenden-Abrufe Yahoo drosseln)
        continue-on-error: true
        timeout-minutes: 10
        run: python etf_daten.py

      - name: Dividenden (Yahoo, höchstens einmal pro Woche neu)
        continue-on-error: true
        timeout-minutes: 20
        run: python dividenden.py

      - name: Zinsen (FRED)
        run: python umfeld.py   # vor dem Zwischenspeichern, damit FRED- und Shiller-Dateien im Cache landen

      - name: Wechselkurs EUR/USD (FRED, Yahoo) für den Umschalter $ / €
        continue-on-error: true
        run: python waehrung.py

      - name: Verbraucherpreise Deutschland/USA (FRED) für die Rendite nach Inflation
        continue-on-error: true
        run: python inflation.py

      - name: Bewertung S&P 500 (Shiller-CAPE)
        run: python bewertung.py

      - name: Geschäftszahlen (SEC EDGAR)
        continue-on-error: true   # SEC-Fehler sollen den Tageslauf nicht stoppen (vorhandene Zahlen bleiben)
        timeout-minutes: 25        # erster Lauf mit ausländischen Firmen holt bis zu 400 Firmendaten einzeln
        env:
          SEC_KONTAKT: ${{ secrets.SEC_KONTAKT }}   # Kontaktangabe, die die SEC verlangt – nur als geheime Einstellung
          STAMM_MINUTEN: "4"   # Branchencode/Sitz je Firma: höchstens 4 Minuten je Lauf, Rest im nächsten Lauf
        run: python fundamente.py

      - name: Nasdaq-100-Mitglieder (Wikipedia, für die Heatmap)
        continue-on-error: true
        run: python nasdaq100.py

      - name: Indexgewichte für das Klumpenrisiko (SPY-Bestand, Factsheets)
        continue-on-error: true
        run: python indexanteile.py

      - name: ISIN-Liste für den Depot-Import (SEC)
        continue-on-error: true
        env:
          SEC_KONTAKT: ${{ secrets.SEC_KONTAKT }}
        run: python isin.py

      - name: ISIN, WKN, Branche und Kurzbeschreibungen (Wikidata, Wikipedia, SEC; höchstens einmal pro Woche neu)
        continue-on-error: true
        timeout-minutes: 15   # Wikidata-Abfragen und höchstens 5 Minuten Wikipedia-Sätze (Rest im nächsten Lauf)
        env:
          WP_MINUTEN: "5"
        run: python beschreibung.py

      - name: Prüfung des Prognose-Kegels (höchstens einmal pro Woche neu)
        continue-on-error: true
        run: python kegelpruefung.py --wenn-alt

      - name: Vorhersage je Wert (genauestes geprüftes Modell; Prüfung ohne Zukunftswissen höchstens einmal pro Woche neu)
        continue-on-error: true   # fehlt die Datei, zeigt die Titelseite den Block einfach nicht
        timeout-minutes: 25
        run: python vorhersage.py

      - name: Kurse zwischenspeichern
        if: always() && hashFiles('daten/kurse.parquet') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            daten/kurse.parquet
            daten/universum.csv
            daten/fred
            daten/shiller
            daten/sec
            daten/nasdaq100.json
            daten/kegelpruefung.json
            daten/vorhersage_pruefung.json
            daten/isin
            daten/beschreibung.json
            daten/beschreibung_offen.txt
            daten/wikipedia_saetze.json
            daten/welt
            daten/welt.csv
            daten/btc_alt
            daten/indexanteile_spy.json
            daten/dividenden.parquet
            daten/dividenden_lauf.json
            daten/etf_daten.json
          key: kurse-${{ github.run_id }}

      - name: Auswertung
        run: |
          python analyse.py
          python tagebuch_pruefung.py
          python trendstudie.py || echo "::warning::Trendstudie nicht gerechnet"

      - name: Rechenregeln prüfen (bei Fehler wird nicht veröffentlicht)
        run: python pruefe_regeln.py

      - name: Alarme aufs Handy (ntfy, nur mit geheimem Themennamen)
        continue-on-error: true
        env:
          NTFY_THEMA: ${{ secrets.NTFY_THEMA }}    # geheimer Themenname der ntfy-App
          ALARM_WERTE: ${{ secrets.ALARM_WERTE }}  # optional: nur diese Werte (sonst alle) – nie ins Repo
        run: python alarm.py

      - name: Stand der Alarme sichern
        if: always() && hashFiles('daten/alarm_stand.json') != ''
        uses: actions/cache/save@v4
        with:
          path: daten/alarm_stand.json
          key: alarm-${{ github.run_id }}

      - name: Statischer Export
        run: python export.py

      - name: Bericht
        if: always()
        run: |
          {
            echo "## Datenstand"
            if [ -f daten/kurse_lauf.json ]; then
              python -c "import json;d=json.load(open('daten/kurse_lauf.json'));print(f\"Kurse: {d['geladen']} von {d['gesamt']} geladen, {d['ohne_daten']} ohne Daten\" + (' – ABGEBROCHEN, alter Stand veröffentlicht' if d['abgebrochen'] else ''))"
            else
              echo "Kursdownload lief nicht."
            fi
            test -d site/daten/werte && echo "Seite: $(du -sh site | cut -f1), $(ls site/daten/werte | wc -l) Werte"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.kurse.outcome }}" != "success" ]; then echo "::warning::Kursdownload fehlgeschlagen – veröffentlicht wird der letzte Stand"; fi
          if [ -f daten/kurse_lauf.json ] && python -c "import json,sys;d=json.load(open('daten/kurse_lauf.json'));sys.exit(0 if d['abgebrochen'] or d['ohne_daten']>0.2*d['gesamt'] else 1)"; then
            echo "::warning::Yahoo lieferte viele Werte nicht – siehe Bericht"
          fi

      - name: Signal-Tagebuch sichern (höchstens ein Eintrag pro Tag, nie ändern)
        continue-on-error: true   # die Seite wird trotzdem veröffentlicht
        run: |
          if [ -n "$(git status --porcelain daten/tagebuch)" ]; then
            # nur neue Dateien zulassen – bestehende Einträge dürfen sich nie ändern
            if git status --porcelain daten/tagebuch | grep -v '^??'; then
              echo "::error::Bestehender Tagebuch-Eintrag wurde verändert – wird nicht gesichert"; exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add daten/tagebuch
            git commit -m "Signal-Tagebuch $(date +%F)"
            git pull --rebase origin main && git push origin HEAD:main
          else
            echo "Kein neuer Tagebuch-Eintrag."
          fi

      - name: Aktuelle Kurse dazulegen (kurse_jetzt.json und feiner Tagesverlauf – damit der volle Lauf die frischen Kurse nicht zurückdreht)
        continue-on-error: true   # ohne die Datei zeigt die Seite einfach den Stand der Auswertung
        timeout-minutes: 8
        run: |
          # Der Kursdownload dieses Laufs liegt schon rund 40 Minuten zurück. Darum kurz vor dem Veröffentlichen die Kurse noch einmal
          # schlank holen. Als Rückfall (Yahoo sperrt gerade) die zuletzt veröffentlichte Datei: Ihre Kurse bleiben stehen, soweit sie
          # nicht älter sind als die neue Auswertung; Ampel und Abstände werden zur neuen Auswertung neu gerechnet.
          curl -sfL --max-time 30 "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/daten/kurse_jetzt.json" -o site/daten/kurse_jetzt.json || rm -f site/daten/kurse_jetzt.json
          python kurse_jetzt.py --site site || echo "::warning::Aktuelle Kurse nicht geholt (Rückgabe $?) – die Seite zeigt die Kurse der Auswertung"

      - name: Neueste Seite übernehmen (falls während des Laufs eine neue hochgeladen wurde)
        continue-on-error: true   # klappt das nicht, wird die Seite vom Beginn des Laufs veröffentlicht
        run: |
          # Der Lauf dauert rund eine Stunde. Wurde in der Zeit die Seite geändert (z. B. über den Schnellweg), würde er sonst
          # die ältere Fassung darüberlegen. Nur site/ wird angefasst – der Arbeitsstand von git bleibt unberührt.
          git fetch --depth 1 origin main
          git show FETCH_HEAD:web/index.html > site/index.html.neu && mv site/index.html.neu site/index.html
          rm -rf site/lib.neu && mkdir site/lib.neu && git archive FETCH_HEAD web/lib | tar -x --strip-components=2 -C site/lib.neu && rm -rf site/lib && mv site/lib.neu site/lib
          echo "Seite auf Stand $(git rev-parse --short FETCH_HEAD)"

      - name: Name der Marke (Stand der Auswertung, siehe paket_wahl.py)
        id: marke
        run: echo "marke=$(python paket_wahl.py --marke site)" >> "$GITHUB_OUTPUT"

      # Marke zuerst: Für die Auswahl des „letzten Pakets“ (schlanker Kurs-Lauf, Schnellweg) zählt ein Paket erst mit beidem.
      - name: Stand der Auswertung als Marke hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.marke.outputs.marke }}
          path: site/daten/statisch.json
          retention-days: 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site    # reduzierte Online-Fassung ohne Kursreihen (export.py)
          retention-days: 1

      - name: Ausfall-Alarm (Online-Lauf gescheitert)
        if: failure()
        env:
          NTFY_THEMA: ${{ secrets.NTFY_THEMA }}
        run: python3 alarm.py --ausfall "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"


  # Veröffentlichen als eigener, kurzer Job (so wie in GitHubs Vorlage für Pages): Nur er steht in der gemeinsamen Gruppe
  # „veroeffentlichen“ mit dem schlanken Kurs-Lauf und dem Schnellweg – der lange Job oben blockiert die beiden nicht.
  # Wird dieser Job einmal verdrängt oder scheitert er, geht nichts verloren: Paket und Marke sind hochgeladen, der nächste
  # schlanke Kurs-Lauf nimmt sie als Grundlage (neueste Auswertung) und veröffentlicht sie mit.
  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: veroeffentlichen
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.veroeffentlichen.outputs.page_url }}
    steps:
      - name: Kurz warten, bis GitHub das Paket kennt
        run: sleep 20   # sonst findet deploy-pages das eben hochgeladene Artefakt manchmal noch nicht (Lauf 44932143003)

      - name: Veröffentlichen
        id: veroeffentlichen
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v5
        if: failure()

      - name: Ausfall-Alarm (Veröffentlichen gescheitert)
        if: failure()
        env:
          NTFY_THEMA: ${{ secrets.NTFY_THEMA }}
        run: python3 alarm.py --ausfall "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
